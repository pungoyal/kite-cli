name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Trusted Publishing requires a GitHub-hosted runner; self-hosted is not
    # supported.
    environment: release
    permissions:
      contents: read
      # Required for OIDC. This is what lets npm verify the workflow identity
      # and generate provenance — no long-lived token exists anywhere.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted Publishing needs npm >=11.5.1 and Node >=22.14.0.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing needs npm >=11.5.1, which every current Node 24
      # bundles. Assert it rather than `npm install -g npm@latest`: an unpinned
      # global install is exactly the code that should never run inside the job
      # holding the publish credential. If a future Node ever regresses, this
      # fails before anything is published.
      - name: Ensure npm supports trusted publishing
        run: |
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);if(a<11||(a===11&&(b<5||(b===5&&c<1))))throw new Error('npm '+process.argv[1]+' is too old for trusted publishing (need >=11.5.1)')" "$(npm -v)"

      - run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
        env:
          TZ: Asia/Kolkata

      - name: Build
        run: npm run build

      - name: Assert the shebang survived the build
        run: |
          head -1 dist/cli.js | grep -qx '#!/usr/bin/env node' \
            || { echo "dist/cli.js is missing its shebang"; exit 1; }

      - name: Validate published package shape
        run: npm run lint:publish

      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      # No NODE_AUTH_TOKEN. Trusted Publishing authenticates via OIDC, and
      # provenance is generated automatically — the --provenance flag is no
      # longer needed. Configure the trusted publisher at
      # npmjs.com/package/@pungoyal/kite-cli/access before the first release.
      - name: Publish
        run: npm publish

  # Runs only after npm accepted the package, so a failed publish never leaves
  # a release page for a version nobody can install.
  github-release:
    name: GitHub Release
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/github-release.yml
    with:
      tag: ${{ github.ref_name }}
