name: OpenSSF Scorecard

# Grades the repository's supply-chain posture (pinned actions, branch
# protection, token permissions, signed releases, …) and publishes the result to
# the Security tab and the public Scorecard API that the README badge reads.
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'
  # Re-score when branch protection changes — that is a scored check.
  branch_protection_rule:
  workflow_dispatch:

# Everything is read-only at the top level; the job opts in to exactly what
# publishing needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # sign the published result via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
