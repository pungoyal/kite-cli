name: CodeQL

# Static analysis for the TypeScript source. Findings land in the repository's
# Security tab rather than failing the build, so a new query upstream can never
# block an unrelated PR — but a real finding is visible before release.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new queries run against unchanged code too.
    - cron: '27 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF results
    steps:
      # Actions are pinned to full commit SHAs, not tags — tags are mutable and
      # a compromised upstream can repoint them (cf. the tj-actions breach).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No build step: CodeQL extracts TypeScript straight from source.
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:javascript-typescript
