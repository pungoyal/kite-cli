name: Feature request
description: Propose a new command, flag, or capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This tool places real orders with real money, so new surface area is weighed against that — see the [non-negotiables in CONTRIBUTING.md](https://github.com/pungoyal/kite-cli/blob/main/CONTRIBUTING.md#non-negotiables) (safety defaults, secret redaction, no blind retries of writes) before proposing something that touches order placement.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow or pain point, not just the feature. A concrete example command you wish existed helps.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed command or flag
      description: Sketch the CLI surface, if you have one in mind.
      placeholder: |
        kite orders place NSE:INFY -s BUY -q 10 --some-new-flag
      render: bash

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Is this already possible by composing existing commands (e.g. with jq), or does it genuinely need new CLI surface?

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is about the CLI/library itself, not a request to Zerodha's Kite Connect API (feature requests for the API belong on Zerodha's [developer forum](https://kite.trade/forum/)).
        - label: If this places, modifies, or cancels an order, it should go through the existing confirmation/kill-switch/value-cap layer rather than adding a new bypass.
